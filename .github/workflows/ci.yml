name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'atlas/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'atlas/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Blocking on purpose: a scanner that cannot fail its job shows the same
      # green check as a clean one.
      - name: Dependency audit
        run: npm audit --audit-level=high
      # rules/atlas-map.md: the committed map, checked at the fleet pin. The pin
      # moves with ATLAS_PIN in the export and the regenerated map, in one change.
      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
