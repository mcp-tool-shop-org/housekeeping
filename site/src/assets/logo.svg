<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <clipPath id="frame"><rect x="40" y="40" width="560" height="560" rx="96"/></clipPath>
  </defs>

  <!-- the warehouse -->
  <rect x="40" y="40" width="560" height="560" rx="96" fill="url(#bg)"/>
  <rect x="40" y="40" width="560" height="560" rx="96" fill="none" stroke="#1e3a5f" stroke-width="6"/>

  <!-- every repository, one cell each: 5 x 5 -->
  <g>
    <!-- row 1 -->
    <rect x="112" y="112" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="199" y="112" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="286" y="112" width="68" height="68" rx="16" fill="#334155"/>
    <rect x="373" y="112" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="460" y="112" width="68" height="68" rx="16" fill="#22c55e"/>
    <!-- row 2 -->
    <rect x="112" y="199" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="199" y="199" width="68" height="68" rx="16" fill="#f59e0b"/>
    <rect x="286" y="199" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="373" y="199" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="460" y="199" width="68" height="68" rx="16" fill="#334155"/>
    <!-- row 3 -->
    <rect x="112" y="286" width="68" height="68" rx="16" fill="#334155"/>
    <rect x="199" y="286" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="286" y="286" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="373" y="286" width="68" height="68" rx="16" fill="#ef4444"/>
    <rect x="460" y="286" width="68" height="68" rx="16" fill="#22c55e"/>
    <!-- row 4 -->
    <rect x="112" y="373" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="199" y="373" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="286" y="373" width="68" height="68" rx="16" fill="#f59e0b"/>
    <rect x="373" y="373" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="460" y="373" width="68" height="68" rx="16" fill="#22c55e"/>
    <!-- row 5 -->
    <rect x="112" y="460" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="199" y="460" width="68" height="68" rx="16" fill="#334155"/>
    <rect x="286" y="460" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="373" y="460" width="68" height="68" rx="16" fill="#22c55e"/>
    <rect x="460" y="460" width="68" height="68" rx="16" fill="#22c55e"/>
  </g>

  <!-- one sweep across all of them -->
  <g clip-path="url(#frame)">
    <line x1="40" y1="600" x2="600" y2="40" stroke="#3b82f6" stroke-opacity="0.22" stroke-width="44" stroke-linecap="round"/>
    <line x1="40" y1="600" x2="600" y2="40" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
